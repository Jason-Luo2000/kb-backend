[project]
name = "kb-sdk"
version = "1.0.0"
description = "kb-backend client SDK (idempotent retry + structured errors)"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kb_sdk"]
