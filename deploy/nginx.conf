# web 容器：托管前端 SPA + 反代 API/健康检查/指标到后端（同源，免 CORS）
server {
    listen 80;
    server_name _;
    client_max_body_size 200m;        # 文档上传上限
    proxy_read_timeout 300s;          # 解析/流式问答给足时间
    proxy_send_timeout 300s;

    # 前端 SPA（react-router 路由回退到 index.html）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API / 健康检查 / 指标 → 后端
    location ~ ^/(v1|healthz|readyz|metrics)(/|$) {
        proxy_pass http://kb-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
